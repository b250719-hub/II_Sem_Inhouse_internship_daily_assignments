<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Pro</title>
</head>
<style>
        /* --- CSS Variables for Light/Dark Themes --- */
        :root {
            --bg-primary: #f8f9fa;
            --bg-nav: #1a1a2e;
            --bg-card: #ffffff;
            --bg-form-section: #eef2f3;
            --text-main: #333333;
            --text-light: #ffffff;
            --accent: #00adb5;
            --accent-hover: #008086;
            --border-color: #cccccc;
            --hero-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --card-shadow: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-primary: #121212;
            --bg-nav: #0f0f1b;
            --bg-card: #1e1e1e;
            --bg-form-section: #1a1a1a;
            --text-main: #f5f5f5;
            --border-color: #444444;
            --hero-gradient: linear-gradient(135deg, #0f0f1b 0%, #121214 100%);
            --card-shadow: rgba(0, 0, 0, 0.4);
        }

        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
           body{
    background-color: var(--bg-primary);
    color: var(--text-main);
    line-height: 1.6;
}
        a { text-decoration: none; color: inherit; }

        /* --- Navigation Bar --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding:15px 30px;
            background-color: var(--bg-nav);
            color: var(--text-light);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 2rem;
        }
        .nav-links a:hover {
            color:#718096;
        }

        /* --- Theme Toggle Button --- */
        .theme-toggle-btn {
            background: none;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .theme-toggle-btn:hover {
            background-color: var(--accent);
            color: var(--text-light);
        }

        /* --- Hero Section --- */
        .hero {
            background: var(--hero-gradient);
            color: var(--text-light);
            padding: 6rem 5%;
            text-align: center;
        }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; }
        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: #bfa3ff;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* --- Buttons --- */
        .btn {
            display: inline-block;
            background-color:#00adb5;
            color::#00adb5;
            padding: 0.8rem 2rem;
            border-radius: 5px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .btn-secondary {
            background-color:#718096;
            border: 1px solid var(--border-color);
            color:#00adb5;
        }
        .btn-secondary:hover {
            background-color:#0f0f1b;
        }

        /* --- Generic Section Setup --- */
        .section { padding: 5rem 5%; text-align: center; }
        .section-title { font-size: 2rem; margin-bottom: 3rem; position: relative; }
        .section-title::after {
            content: ''; display: block; width: 50px; height: 3px; background-color: var(--accent); margin: 10px auto 0;
        }

        /* --- Grid & Cards --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2.5rem;
            max-width: 1100px;
            margin: 0 auto;
        }
        .card {
            background: var(--bg-card);
            padding: 2.5rem 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px var(--card-shadow);
        }
        .card-icon { font-size: 2.5rem; color: var(--accent); margin-bottom: 1rem; }
        .team-card {
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px var(--card-shadow);
            padding-bottom: 1.5rem;
        }
        .team-img {
            width: 100%; height: 200px; background-color: #e2e8f0;
            display: flex; align-items: center; justify-content: center; color: #718096;
        }

        /* --- Registration Form Section --- */
        .form-section { background-color: var(--bg-form-section); }
        .form-container {
            max-width: 500px; margin: 0 auto; background: var(--bg-card);
            padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 15px var(--card-shadow); text-align: left;
        }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        .form-group input {
            width: 100%; padding: 0.75rem; border: 1px solid var(--border-color);
            background-color: var(--bg-primary); color: var(--text-main); border-radius: 4px;
        }
        .form-group input:focus { outline: none; border-color: var(--accent); }
        
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .form-actions .btn { flex: 2; }
        .form-actions .btn-secondary { flex: 1; }

        .btn,
input[type="submit"],
input[type="reset"] {
    background-color: #00adb5;
    color: white;
    padding: 0.8rem 2rem;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

.btn:hover,
input[type="submit"]:hover,
input[type="reset"]:hover {
    background-color: #008086;
}

    
       
    </style>
<body>
    <nav class="navbar">
        <div class="logo">TechNova</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#features">Features</a></li>
            <li><a href="#team">Team</a></li>
            <li><a href="#register">Register</a></li>
        </ul>
        <button id="themeBtn">🌙 DARK MODE</button>
    </nav>

             <input type="email" name="myemail" id="email" required> 
        </div><br>
        <label for="password">PASSWORD</label>
        <div>
            <input type="password" name="mypassword" id="password" reqiured>
        </div><br>
        </form>
        <div>
            <input type="submit" value="submit Now" class="btn">        
            <input type="reset" value="reset now" class="btn btn-secondary">
        </div>
    
    
</body>
<script>
        // --- Dark/Light Mode Switch Engine ---
        const themeBtn = document.getElementById("themeBtn");

themeBtn.addEventListener("click", () => {
    const currentTheme = document.documentElement.getAttribute("data-theme");

    if (currentTheme === "dark") {
        document.documentElement.removeAttribute("data-theme");
        themeBtn.textContent = "🌙 DARK MODE";
    } else {
        document.documentElement.setAttribute("data-theme", "dark");
        themeBtn.textContent = "☀️ LIGHT MODE";
    }
});

    </script>
</html>
