<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Student Directory</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<style>
    header{
        background: black;
        color: white;
        width: 100%;
        
    }
    .navbar{
        display:flex;
        justify-content: space-evenly;
        align-items: center;
    }
    .navbar-logo{
        display: flex;
        align-items: center;
        gap: 15px;
    }
    body {
        font-family:Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 20px;
    }

    .card {
        background: white;
        width: 320px;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .card-body {
        padding: 15px;
    }
    .card img{
        width:auto;
        height:80px;
    }
    .btn {
        background-color: #6200ee;
        color: white;
        border: none;
        padding: 10px 15px;
        cursor: pointer;
        border-radius: 4px;
        transition: 0.3s;
    }

    .details {
        margin-top: 15px;
        padding: 10px;
        background: #f9f9f9;
        border-left: 4px solid #6200ee;
    }
</style>

<body>
    <header>
        <nav class="navbar">
            <div class="header-container">
            <a href="#" class="navbar-logo">
            <img src="c:\Users\darsh\Downloads\boyicon.png" alt="logo" width="30" height="24" class="rounded-circle mb-3">
            <h1>Student Directory</h1>
            </a>
            </div>
        </nav>
    </header>
    <div class="row"> <!-- Hidden initially for fadeIn bonus -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body">
                    <img src="c:\Users\darsh\Downloads\girlicon.png" alt="Thumbnail" class="rounded-circle mb-3">
                    <h3>Priya Sharma</h3>
                    <button class="btn">Show Details</button>
                    <p class="details" style="display:none;">CGPA:8.4</p>
                    <p class="details" style="display:none;">Branch:CSE</p>
                    <p class="details" style="display:none;">Email:priya@gmail.com</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body">
                    <img src="c:\Users\darsh\Downloads\boyicon.png" alt="Thumbnail" class="rounded-circle mb-3">
                    <h3>Aman Verma</h3>
                    <button class="btn">Show Details</button>
                    <p class="details" style="display:none;">CGPA:8.9</p>
                    <p class="details" style="display:none;">Branch:CSE</p>
                    <p class="details" style="display:none;">Email:aman@gmail.com</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body">
                    <img src="c:\Users\darsh\Downloads\girlicon.png" alt="Thumbnail" class="rounded-circle mb-3">
                    <h3>Nandini Sharma</h3>
                    <button class="btn">Show Details</button>

                    <p class="details" style="display:none;">Branch:IoT</p>
                    <p class="details" style="display:none;">Email:nandini@gmail.com</p>

            </div>
        </div>
    </div>
    <script>
        $(document).ready(function(){

    $(".card").hide().fadeIn(1000);

});
        $(".btn").click(function () {
            $(this).closest(".card").find(".details").slideToggle();
        });
    </script>
</body>

</html>
