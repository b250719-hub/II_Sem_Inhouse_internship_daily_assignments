<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live User Directory</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<style>
body{
    background:#f5f5f5;
}

.card{
    transition:0.3s;
    border-radius:12px;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    margin:15px auto;
}
</style>
<body>

<div class="container py-5">

    <h1 class="text-center mb-4">
        Live User Directory
    </h1>

    <!-- Loading -->
    <div id="loading" class="text-center">
        <div class="spinner-border text-primary"></div>
        <p class="mt-3">Loading users...</p>
    </div>

    <!-- Error -->
    <div id="error" class="alert alert-danger text-center d-none">
        Failed to load users. Please try again later.
    </div>

    <!-- Cards -->
    <div class="row" id="userContainer"></div>

</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- JavaScript -->
<script src="script.js"></script>

</body>
<script>
$(document).ready(function () {

    $("#loading").show();
    $("#error").addClass("d-none");

    fetch("https://jsonplaceholder.typicode.com/users")
        .then(function(response){

            if(!response.ok){
                throw new Error("Network response was not OK");
            }

            return response.json();
        })

        .then(function(users){

            $("#loading").hide();

            let output = "";

            users.slice(0,5).forEach(function(user){

                output += `
                <div class="col-md-4 mb-4">
                    <div class="card h-100 text-center shadow">

                        <img src="https://i.pravatar.cc/150?img=${user.id}"
                             class="avatar">

                        <div class="card-body">

                            <h5 class="card-title">${user.name}</h5>

                            <p><strong>Username:</strong> ${user.username}</p>

                            <p><strong>Email:</strong> ${user.email}</p>

                            <p><strong>Phone:</strong> ${user.phone}</p>

                            <p><strong>Company:</strong> ${user.company.name}</p>

                            <p><strong>City:</strong> ${user.address.city}</p>

                        </div>
                    </div>
                </div>
                `;

            });

            $("#userContainer").html(output);

        })

        .catch(function(error){

            $("#loading").hide();

            $("#error").removeClass("d-none");

            console.error(error);

        });

});
</script>
</html>
