<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>College Admission Form</title>
        <style>
            h1{
                text-align:center;
                color:#2c3e50
            }
            label{
                font-weight:bold;
                }
            input,select,textarea{
                width:75%;
                padding:10px;
                margin-top:5px;
                margin-bottom:15px;
                border:1px solid #aaa;
                border-radius:8px;
                box-sizing:border-box;
            }
button{
    width:75%;
    padding:12px;
    background:#3498db;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button:hover{
    background:#29b948
}
        </style>
    </head>
    <body>
        <div class="admission form">
    <h1>College Admission Form</h1>
    <form>
        <label>Full Name</label><br>
        <input type="text" placeholder="Enter your name"required><br><br>

        <label>Email</label><br>
        <input type="email" placeholder="Enter your email"required><br><br>

        <label>Phone Number</label><br>
        <input type="tel" placeholder="Enter phone number"required><br><br>

        <label>Dath of Birth</label><br>
        <input type="date" required><br><br>

        <label>Gender</label><br>
        <select required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select><br><br>

        <label>Course</label><br>
        <select required>
            <option value="">Choose Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>M.Tech</option>
            <option>B.Sc</option>
        </select><br><br>
        
        <label>Address</label><br>
        <textarea rows="4" placeholder="Enter your address"></textarea><br><br>

        <button type="submit">Submit Application</button>
    </form>
</div>
    </body>
</html>
