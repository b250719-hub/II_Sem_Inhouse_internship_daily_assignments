<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Cards</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    padding:40px;
    animation:fadeIn 1s ease-in;
}

/* Fade In Animation */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.container{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.card{
    background:white;
    width:280px;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
}

.card h2{
    color:#333;
}

.card p{
    margin:8px 0;
}

.details{
    display:none;
    margin-top:10px;
    border-top:1px solid #ddd;
    padding-top:10px;
}

button{
    margin-top:15px;
    padding:10px 18px;
    border:none;
    background:#007BFF;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}
</style>

</head>
<body>

<div class="container">

    <div class="card">
        <h2>Rahul Sharma</h2>
        <p>Roll No: 101</p>

        <div class="details">
            <p>Age: 20</p>
            <p>Course: B.Tech CSE</p>
            <p>Email: rahul@gmail.com</p>
            <p>Phone: 9876543210</p>
        </div>

        <button onclick="toggleDetails(this)">
            Show Details
        </button>
    </div>

    <div class="card">
        <h2>Priya Singh</h2>
        <p>Roll No: 102</p>

        <div class="details">
            <p>Age: 21</p>
            <p>Course: BCA</p>
            <p>Email: priya@gmail.com</p>
            <p>Phone: 9876501234</p>
        </div>

        <button onclick="toggleDetails(this)">
            Show Details
        </button>
    </div>

    <div class="card">
        <h2>Aman Verma</h2>
        <p>Roll No: 103</p>

        <div class="details">
            <p>Age: 22</p>
            <p>Course: B.Sc IT</p>
            <p>Email: aman@gmail.com</p>
            <p>Phone: 9876512345</p>
        </div>

        <button onclick="toggleDetails(this)">
            Show Details
        </button>
    </div>

</div>

<script>

function toggleDetails(button){

    // Find the details div inside the same card
    let details = button.previousElementSibling;

    if(details.style.display === "block"){

        details.style.display = "none";
        button.innerText = "Show Details";

    }
    else{

        details.style.display = "block";
        button.innerText = "Hide Details";

    }

}

</script>

</body>
</html>
