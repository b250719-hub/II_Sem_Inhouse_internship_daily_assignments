<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form</title>
</head>
<style>
    h1{ text-align: center;
        text-decoration: dashed;}
    .container{ display:grid;
                place-items:center;
                height:100vh;
                max-width:700px;
                width:90%;
                margin:30px auto;
                background-color: azure;}
    label{color:darkgoldenrod;
          font-size:x-large;
          font-family: courier;}
    button{background-color:rgb(144, 213, 223);}
    body{background-color: aquamarine;}
</style>
<body>
    <h1>COLLEGE ADMISSION FORM</h1>
   <div class="container">
    <form>
        <label>Name</label><br><br>
        <input type="text" placeholder="Enter your Name" required><br><br>
        <label>E-Mail</label><br><br>
        <input type="email" placeholder="Enter email" required><br><br>
        <label>D.O.B.</label><br><br>
        <input type="date"><br><br>
        <label>Gender</label><br><br>
        <select required>
        <option value="">Select gender</option>
        <option> MALE</option>
        <option> FEMALE</option>
        <option> OTHERS</option>
        </select><br><br>
        <label> COURSE</label><br><br>
        <select required>
            <option>B.Tech.</option>
            <option>BCA</option>
        </select><br><br>
        <label>Contact</label><br><br>
        <input type="tel" placeholder="Enter contact"><br><br>
        <label>Address</label><br><br>
        <textarea rows="4"  placeholder="Enter address"></textarea><br><br>
        <button type="submit">SUBMIT FORM</button><br><br>
        </form>
    </div>
</body>
</html>
